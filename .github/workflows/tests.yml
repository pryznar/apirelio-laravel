name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared PHP core
        run: git clone --depth 1 https://github.com/pryznar/apirelio-php-core.git ../php-core

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Laravel version
        run: >
          composer require --no-update
          "illuminate/console:^${{ matrix.laravel }}.0"
          "illuminate/config:^${{ matrix.laravel }}.0"
          "illuminate/http:^${{ matrix.laravel }}.0"
          "illuminate/routing:^${{ matrix.laravel }}.0"
          "illuminate/support:^${{ matrix.laravel }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer phpstan
